[package]
name = "snip-core"
version = "2.0.0"
edition = "2021"
description = "Lógica de FFmpeg/FFprobe de Snip, sin dependencias de UI (testeable en cualquier plataforma)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
