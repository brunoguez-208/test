[package]
name = "snip"
version = "2.0.0"
description = "Snip — editor de video rápido para Windows 11"
authors = ["Bruno"]
edition = "2021"
rust-version = "1.80"

[workspace]
members = ["core"]

[lib]
name = "snip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-decorum = "1.1.1"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
snip-core = { path = "core" }

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8.1"
windows = { version = "0.62", features = [
  "Foundation",
  "UI",
  "UI_ViewManagement",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
