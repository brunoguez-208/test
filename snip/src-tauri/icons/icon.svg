<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="140" y1="120" x2="900" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FB6FF"/>
      <stop offset="0.55" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#6A3CF5"/>
    </linearGradient>
    <linearGradient id="sheen" x1="512" y1="120" x2="512" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
