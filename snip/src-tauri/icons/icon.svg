  </defs>
  <rect x="96" y="96" width="832" height="832" rx="200" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="96" y="96" width="832" height="832" rx="200" fill="url(#sheen)"/>
  <rect x="97.5" y="97.5" width="829" height="829" rx="198.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>
